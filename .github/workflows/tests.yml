# Runs the overlay's logic tests on every push and pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  logic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the packages
        run: pip install -r requirements-lock.txt
      - name: Logic tests
        run: python tests/test_logic.py
      - name: Loot and UI regression tests
        run: python -B -m unittest discover -s tests -p "test_loot*.py"
      - name: Fork isolation and integration
        run: python -B tests/test_fork_settings.py
