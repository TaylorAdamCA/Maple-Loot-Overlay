# Builds an unsigned fork artifact on manual request. Does not publish a release.
name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      TESSERACT_DIR: 'C:\Program Files\Tesseract-OCR'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the packages (the versions the releases are built with)
        run: pip install -r requirements-lock.txt pyinstaller==6.17.0
      - name: Install Tesseract OCR
        run: choco install tesseract --version 5.5.0.20241111 -y --no-progress
      - name: Tests
        run: |
          python tests/test_logic.py
          python tests/test_screen.py
          python -B -m unittest discover -s tests -p "test_loot*.py"
          python -B tests/test_fork_settings.py
      - name: Build
        run: python build.py
      - name: Keep the unsigned build
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: build/dist/Maple Loot Overlay
      - name: Keep the download
        uses: actions/upload-artifact@v4
        with:
          name: download
          path: release/*.zip
